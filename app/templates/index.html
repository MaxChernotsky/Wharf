{% extends "base.html" %}
{% import "partials/icons.html" as icons %}
{% block content %}
<div class="page-head">
  <h1>Tools</h1>
  <div class="page-head-actions">
    <input type="search" id="tool-search" placeholder="Filter tools…" autocomplete="off">
    <button class="btn btn-ghost" hx-post="/api/rescan" hx-swap="none" title="Rescan"
            onclick="setTimeout(() => htmx.trigger('#dash', 'refresh'), 300)">{{ icons.rotate_cw(14) }}<span class="label">Rescan</span></button>
  </div>
</div>
<div id="dash"
     hx-get="/partials/tools"
     hx-trigger="every 3s, refresh"
     hx-swap="innerHTML">
  {% include "partials/dashboard.html" %}
</div>
<script>
(function () {
  const search = document.getElementById("tool-search");
  const FAVICON_BASE = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><line x1="2.2" y1="19.4" x2="21.8" y2="19.4" stroke="%23364554" stroke-width="1.5" stroke-linecap="round"/><line x1="6.2" y1="19.4" x2="6.2" y2="14.4" stroke="%23364554" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="19.4" x2="12" y2="7.6" stroke="%23364554" stroke-width="1.8" stroke-linecap="round"/><line x1="17.8" y1="19.4" x2="17.8" y2="11.4" stroke="%23364554" stroke-width="1.8" stroke-linecap="round"/><path d="M6.2 14.4 L12 7.6 L17.8 11.4" fill="none" stroke="%234f9cf9" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><circle cx="6.2" cy="14.4" r="1" fill="%237d8894"/><circle cx="12" cy="7.6" r="1.5" fill="%234f9cf9"/><circle cx="17.8" cy="11.4" r="1.1" fill="%2334c07c"/></svg>';
  const FAVICON_LIVE = FAVICON_BASE.replace('</svg>', '<circle cx="19" cy="5" r="4.5" fill="%2334c07c"/></svg>');

  function applyFilter() {
    const q = search.value.trim().toLowerCase();
    document.querySelectorAll("#dash .card").forEach((card) => {
      const name = (card.querySelector(".name")?.textContent || "") + " " + card.id;
      card.style.display = !q || name.toLowerCase().includes(q) ? "" : "none";
    });
  }
  function applyBadge() {
    const n = parseInt(document.querySelector("#dash .overview")?.dataset.running || "0", 10);
    document.title = n > 0 ? `Wharf (${n} running)` : "Wharf";
    document.querySelector('link[rel="icon"]').href = n > 0 ? FAVICON_LIVE : FAVICON_BASE;
  }
  search.addEventListener("input", applyFilter);
  document.body.addEventListener("htmx:afterSwap", (e) => {
    if (e.target.id === "dash") { applyFilter(); applyBadge(); }
  });
  applyBadge();
})();
</script>
{% endblock %}
